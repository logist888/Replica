# Запуск на чистом сервере:  cp deploy/.env.example deploy/.env  (заполнить)  &&  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD}
      POSTGRES_DB: pilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d pilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    # порт наружу не публикуется

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pilot:${DB_PASSWORD}@db:5432/pilot
      ADMIN_TOKEN: ${ADMIN_TOKEN:?задайте ADMIN_TOKEN (не короче 16 символов)}
      NEXT_PUBLIC_DOCS_URL: https://logist888.github.io/Replica
    # порт наружу не публикуется: приложение доступно только через caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
